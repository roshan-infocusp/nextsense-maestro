# Maestro configuration and test credentials.
# Update the env section below with your test account details before running.
#
# Run all tests:   maestro test --config config/env.yaml flows/
# Run one test:    maestro test --config config/env.yaml flows/onboarding_smoke.yaml
# Open in Studio:  maestro studio --config config/env.yaml flows/onboarding_smoke.yaml

flows:
  - "flows/**/*.yaml"

excludeTags:
  - wip

executionOrder:
  continueOnFailure: true

testOutputDir: reports/

env:
  dev:
    APP_ID: io.nextsense.android.budz
    TEST_NAME: Dev_User
  staging:
    APP_ID: io.nextsense.android.budz
    TEST_NAME: Stage_User
  prod:
    APP_ID: io.nextsense.android.budz
    TEST_NAME: Prod_User
