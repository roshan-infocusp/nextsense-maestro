name: Maestro Onboarding Smoke Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Test environment (dev / staging / prod)"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Enable KVM (hardware acceleration for emulator) ───
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ── 3. Java ──────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      # ── 4. Maestro CLI ───────────────────────────────────────
      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      # ── 5. Python (for HTML report) ──────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 6. Download APK ──────────────────────────────────────
      - name: Download APK from GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p apps
          echo "Downloading APK..."
          gh release download v1.0.0 \
            --repo roshan-infocusp/nextsense-maestro \
            --pattern "budz-debug.apk" \
            --dir apps \
            --clobber
          echo "APK size: $(du -sh apps/budz-debug.apk)"

      # ── 7. Resolve environment credentials ───────────────────
      - name: Set environment credentials
        run: |
          ENV="${{ github.event.inputs.environment || 'dev' }}"
          echo "ENV=$ENV" >> $GITHUB_ENV

          if [ "$ENV" = "prod" ]; then
            echo "TEST_NAME=Prod_User"                                    >> $GITHUB_ENV
            echo "TEST_EMAIL=${{ secrets.PROD_TEST_EMAIL }}"              >> $GITHUB_ENV
            echo "TEST_PASSWORD=${{ secrets.PROD_TEST_PASSWORD }}"        >> $GITHUB_ENV
          elif [ "$ENV" = "staging" ]; then
            echo "TEST_NAME=Stage_User"                                   >> $GITHUB_ENV
            echo "TEST_EMAIL=${{ secrets.STAGING_TEST_EMAIL }}"           >> $GITHUB_ENV
            echo "TEST_PASSWORD=${{ secrets.STAGING_TEST_PASSWORD }}"     >> $GITHUB_ENV
          else
            echo "TEST_NAME=Dev_User"                                     >> $GITHUB_ENV
            echo "TEST_EMAIL=${{ secrets.DEV_TEST_EMAIL }}"               >> $GITHUB_ENV
            echo "TEST_PASSWORD=${{ secrets.DEV_TEST_PASSWORD }}"         >> $GITHUB_ENV
          fi

      # ── 8. Install emulator & system image ───────────────────
      - name: Install emulator and system image
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "emulator" \
            "platform-tools" \
            "system-images;android-34;default;x86_64"

      # ── 9. Create AVD ─────────────────────────────────────────
      - name: Create AVD
        run: |
          # Pin AVD location so emulator can find it
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> $GITHUB_ENV
          mkdir -p $HOME/.android/avd
          echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager \
            create avd -n test_avd \
            -k "system-images;android-34;default;x86_64" \
            --force
          echo "Created AVDs:"
          ls -la $HOME/.android/avd/

      # ── 10. Start emulator ────────────────────────────────────
      - name: Start emulator
        run: |
          export ANDROID_AVD_HOME=$HOME/.android/avd
          $ANDROID_HOME/emulator/emulator \
            -avd test_avd \
            -no-snapshot-save \
            -no-window \
            -gpu swiftshader_indirect \
            -noaudio \
            -no-boot-anim \
            -memory 4096 &
          echo "Waiting for emulator to boot..."
          $ANDROID_HOME/platform-tools/adb wait-for-device
          until $ANDROID_HOME/platform-tools/adb shell getprop sys.boot_completed 2>/dev/null | grep -q "1"; do
            echo "Still booting..."
            sleep 5
          done
          echo "Emulator booted!"
          $ANDROID_HOME/platform-tools/adb shell input keyevent 82

      # ── 11. Install APK & configure device ────────────────────
      - name: Install APK and configure device
        run: |
          adb install -r apps/budz-debug.apk
          adb shell settings put global bluetooth_on 1
          adb shell pm grant io.nextsense.android.budz android.permission.BLUETOOTH_SCAN
          adb shell pm grant io.nextsense.android.budz android.permission.BLUETOOTH_CONNECT
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      # ── 12. Run Maestro tests ─────────────────────────────────
      - name: Run Maestro smoke test
        run: |
          maestro test \
            --config config/env.yaml \
            --env APP_ID=io.nextsense.android.budz \
            --env TEST_NAME="$TEST_NAME" \
            --env TEST_EMAIL="$TEST_EMAIL" \
            --env TEST_PASSWORD="$TEST_PASSWORD" \
            flows/onboarding_smoke.yaml

      # ── 13. Generate HTML report ─────────────────────────────
      - name: Generate HTML report
        if: always()
        run: |
          mkdir -p reports
          python3 generate_report.py || echo "No report data to generate"

      # ── 14. Upload report & screenshots ──────────────────────
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report-${{ env.ENV }}-${{ github.run_number }}
          path: reports/
          retention-days: 7
